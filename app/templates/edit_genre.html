{% extends "base.html" %}

{% block title %}Редактировать жанр{% endblock %}

{% block content %}
    <h1>Редактировать жанр</h1>

    <div style="margin-bottom: 30px; background: #f9f9f9; padding: 15px; border-radius: 5px;">
        <form action="/genres/{{ genre.id }}/edit" method="post">
            <p>
                <label>Название жанра:</label><br>
                <input type="text" name="title" value="{{ genre.title }}" required>
            </p>
            <button type="submit" style="margin-top: 10px;">Сохранить изменения</button>
            <a href="/genres" style="margin-left: 10px;">Отмена</a>
        </form>
    </div>
{% endblock %}
