{% extends "base.html" %}

{% block title %}Жанры{% endblock %}

{% block content %}
    <h1>Жанры</h1>

    <div style="margin-bottom: 30px; background: #f9f9f9; padding: 15px; border-radius: 5px;">
        <h3>Добавить жанр</h3>
        <form action="/genres/new" method="post">
            <input type="text" name="title" placeholder="Название жанра" required>
            <button type="submit">Добавить</button>
        </form>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        {% for genre in genres %}
        <tr>
            <td>{{ genre.id }}</td>
            <td>{{ genre.title }}</td>
            <td>
                <a href="/genres/{{ genre.id }}/edit" style="color: blue; margin-right: 10px;">Изменить</a>
                <form action="/genres/{{ genre.id }}/delete" method="post" style="display: inline;">
                    <button type="submit" class="btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">Жанров пока нет.</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
